name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Zed runs on all three, and the extension does its own path handling.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target wasm32-wasip2

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs on the host, not wasm: the path handling has to be checked on a
      # platform other than the one it is written on.
      - run: cargo test

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --target wasm32-wasip2 -- -D warnings

  manifest:
    name: extension manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Catches the mismatches Zed reports quietly or not at all: a grammar key
      # that won't link, and a bracket scope missing from overrides.scm.
      - run: scripts/check-manifest.py
