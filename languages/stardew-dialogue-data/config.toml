# The game's own dialogue files — `Dialogue/<Name>/Dialogue.json` and the like —
# where every value is dialogue rather than a Content Patcher patch. No
# path_suffixes: the names vary per pack, so this is reached through a
# `file_types` glob.
name = "Stardew Dialogue Data"
grammar = "stardew_json"
line_comments = ["// "]
block_comment = { start = "/* ", end = " */", prefix = "", tab_size = 1 }
autoclose_before = ",}]"
tab_size = 2
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
