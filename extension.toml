id = "stardew-mdk"
name = "Stardew Valley MDK"
version = "0.1.0"
schema_version = 1
authors = ["eth0net <eth0net@pm.me>"]
description = "Syntax highlighting and schema validation for Stardew Valley mods: SMAPI manifests, Content Patcher content packs and translation files"
repository = "https://github.com/eth0net/zed-stardew-mdk"

languages = [
  "languages/content-patcher",
  "languages/stardew-json",
  "languages/stardew-dialogue",
  "languages/stardew-dialogue-data",
  "languages/stardew-event",
]

# Registered as `stardew_json` because Zed links the parser by its export
# symbol, `tree_sitter_stardew_json`. Bump `commit` with scripts/bump-grammar-rev.py.
[grammars.stardew_json]
repository = "https://github.com/eth0net/tree-sitter-stardew-json"
commit = "8b44780766d3729528f8fc76848191d167b60191"

[grammars.stardew_dialogue]
repository = "https://github.com/eth0net/tree-sitter-stardew-dialogue"
commit = "dbb822de62be4a5acc5b5e0b8f5d1bf89edb5b93"

[grammars.stardew_event]
repository = "https://github.com/eth0net/tree-sitter-stardew-event"
commit = "b3ac1faf756bf15fdde3b544dbf4cf63b623a813"

[language_servers.stardew-json-language-server]
name = "Stardew JSON"
languages = ["Content Patcher", "Stardew JSON"]

# vscode-json-language-server only serves documents it recognises, and `jsonc`
# is the id that enables its comment-tolerant mode.
[language_servers.stardew-json-language-server.language_ids]
"Content Patcher" = "jsonc"
"Stardew JSON" = "jsonc"
